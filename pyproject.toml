[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-lsrpc-bridge"
version = "2.0.0"
description = "Antigravity Language Server ConnectRPC Bridge, Live Plugin Manager, Validator & Scaffolder"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "orakulzero", email = "129319184+orakulzero@users.noreply.github.com"}
]
keywords = ["antigravity", "connectrpc", "lsrpc", "plugin-manager", "agentops"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
agy-lsrpc-bridge = "agy_lsrpc_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
